name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  # Fast, secret-free gate that protects every push/PR: formatting, compilation,
  # and the fork-free unit tests.
  build-test:
    name: fmt + build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than `stable`, because `forge fmt` is not stable across releases:
      # 1.8.0 changed the indentation of named struct arguments nested inside a chained
      # call, so a tree formatted by one release fails `--check` under the next. That is
      # what turned this job red without a source change. Bump this deliberately,
      # reformatting in the same commit. Keep every install site in this repo and in
      # koreth-v1-core on the same version — their [fmt] settings are identical, so a
      # mismatch is a red check in one repo and not the other.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      # Formatting only reads src/, test/ and script/, so it needs no submodules. Kept
      # ahead of the checkout so a formatting error is reported as such rather than being
      # hidden behind a credential failure.
      - name: Check formatting
        run: forge fmt --check

      - uses: ./.github/actions/checkout-submodules
        with:
          token: ${{ secrets.NO_SUCH_SUBMODULE_TOKEN }}

      # via-IR compilation of core (pulled in as a submodule) is memory-hungry;
      # the 2-core/7GB runner OOMs without extra headroom. Add swap so solc
      # doesn't get killed.
      - name: Add swap space
        run: |
          # The runner already has a /swapfile; add a second, larger one on the
          # big /mnt scratch disk rather than colliding with the existing file.
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          swapon --show

      # Cache the Foundry build so only the first run pays the full via-IR cost.
      # Keyed on the core submodule commit too: periphery compiles core's sources
      # from lib/, so a submodule bump invalidates the build even when no file
      # tracked below has changed.
      - name: Cache forge build
        uses: actions/cache@v4
        with:
          path: |
            out
            cache
          key: forge-${{ runner.os }}-${{ hashFiles('src/**/*.sol', 'test/**/*.sol', 'foundry.toml', 'remappings.txt', 'lib/koreth-v1-core/src/**/*.sol') }}
          restore-keys: forge-${{ runner.os }}-

      - name: Build (with contract sizes / EIP-170 check)
        run: forge build --sizes

      - name: Unit tests (no fork)
        run: forge test --match-path "test/unit/**" -vvv

  # e2e tests run against a mainnet fork, so they need an RPC endpoint on top of
  # the submodule token. Missing either one fails the job rather than skipping it.
  fork-test:
    name: fork tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same version as build-test above. This job does not format, but it does the
      # via-IR compile of core from lib/, and a solc or optimiser difference between the
      # two jobs would mean the artifacts they cache are not interchangeable.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - uses: ./.github/actions/checkout-submodules
        with:
          token: ${{ secrets.NO_SUCH_SUBMODULE_TOKEN }}

      # The e2e suite pins its fork block, so every run reads the same historical state and the
      # responses can be replayed from disk. Without this each run re-fetches thousands of storage
      # slots from the provider, which is both slow and the reason a run can die on a single
      # timed-out request. Keyed on the tests because that is what decides which state gets read.
      - name: Cache fork RPC responses
        uses: actions/cache@v4
        with:
          path: ~/.foundry/cache/rpc
          key: rpc-${{ runner.os }}-${{ hashFiles('test/e2e/**/*.sol', 'lib/koreth-v1-core/test/**/*.sol') }}
          restore-keys: rpc-${{ runner.os }}-

      - name: Fork tests
        env:
          ETH_RPC_URL: ${{ secrets.NO_SUCH_ETH_RPC_URL }}
        run: |
          # Fail rather than skip, for the same reason as the submodule token above and matching
          # koreth-v1-core's fork job: a job that exits 0 without an endpoint publishes the same
          # green tick as one that ran the whole e2e suite, so a secret that quietly stops
          # resolving looks exactly like a passing build. That has already happened in core — two
          # consecutive green runs executed no fork test at all. This repository is private with
          # no forks, so no outside contributor is spared a red check by skipping.
          if [ -z "$ETH_RPC_URL" ]; then
            echo "::error::ETH_RPC_URL is not set, so the e2e fork suite cannot run. Failing rather than reporting a green run that tested nothing."
            exit 1
          fi
          # A cold cache still means thousands of live requests, so ride out a provider hiccup
          # rather than failing the whole suite on one dropped response.
          forge test --fork-url "$ETH_RPC_URL" --match-path "test/e2e/**" -vvv \
            --fork-retries 5 --fork-retry-backoff 2
